<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    
    <title>DOM</title>
</head>
<body>
    <div class="contenedor-central">
        <h1>Interactividad con el DOM</h1>
        <p>Haz clic en el boton para incrementar el contador y registrar la hora exacta del evento en la tabla</p>
        <div class="contador">
        <h1 id="numero">0</h1>
        </div>

        <button class="boton" id="btnClic">
        <h3>¡Haz Clic Aqui!</h3>
        </button>

       <div class="tabla">
            <table>
                <thead>
                    <tr>
                        <th>N° Clic</th>
                        <th>Hora</th>
                    </tr>
                </thead>

                <tbody id="registro">
                </tbody>
            </table>
        </div>

        </div>
    
    </div>

    <script src="index.js"></script>

</body>
</html>
